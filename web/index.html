<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Digit Recognition</title>
  <style>
    body {
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      background: #f5f7fa;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
    }

    .container {
      background: white;
      width: 420px;
      margin-top: 60px;
      padding: 30px 35px;
      border-radius: 14px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.08);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      font-weight: 600;
      font-size: 26px;
      color: #222;
    }

    input[type="file"] {
      margin: 15px auto;
      padding: 10px;
      cursor: pointer;
    }

    button {
      background: #0078ff;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s ease;
      margin-top: 10px;
    }

    button:hover {
      background: #005fcc;
    }

    #result {
      margin-top: 25px;
      padding: 15px;
      background: #f0f4ff;
      color: #333;
      border-radius: 8px;
      font-size: 15px;
      text-align: left;
      white-space: pre-wrap;
    }

    .loader {
      margin: 20px auto;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #0078ff;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      animation: spin 1s linear infinite;
      display: none;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Upload Digit CSV</h1>

    <form id="uploadForm">
      <input type="file" id="fileInput" name="file" accept=".csv" />
      <br>
      <button type="submit">Predict</button>
    </form>

    <div class="loader" id="loadingSpinner"></div>

    <pre id="result"></pre>
  </div>

  <script>
    const form = document.getElementById("uploadForm");
    const result = document.getElementById("result");
    const spinner = document.getElementById("loadingSpinner");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const file = document.getElementById("fileInput").files[0];
      if (!file) {
        result.textContent = "Please choose a file first.";
        return;
      }

      const fd = new FormData();
      fd.append("file", file);

      result.textContent = "";
      spinner.style.display = "block";

      try {
        const r = await fetch("/predict", { method: "POST", body: fd });
        const j = await r.json();
        spinner.style.display = "none";

        result.textContent = JSON.stringify(j, null, 2);
      } catch (err) {
        spinner.style.display = "none";
        result.textContent = "Error: " + err;
      }
    });
  </script>
</body>
</html>
