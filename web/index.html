<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Digit Recognition</title>

<style>
body {
  font-family: "Segoe UI", Roboto, Arial;
  background:#f5f7fa;
  display:flex;
  justify-content:center;
}
.container {
  background:white;
  width:450px;
  margin-top:50px;
  padding:25px 30px;
  border-radius:14px;
  box-shadow:0 8px 18px rgba(0,0,0,.08);
  text-align:center;
}
h1 { margin-top:0; }

canvas {
  background:black;
  border-radius:10px;
  cursor:crosshair;
}

button {
  background:#0078ff;
  border:none;
  color:white;
  padding:10px 18px;
  border-radius:8px;
  cursor:pointer;
  margin:10px;
}
button:hover { background:#005dcc; }

.result {
  margin-top: 25px;
  padding: 18px;
  border-radius: 12px;
  background: #eef3ff;
  display: flex;
  flex-direction: column;
  align-items: center;
  transition: .25s ease;
}

.result.success {
  background: #e7ffef;
  border: 2px solid #3ecf57;
}

.result.error {
  background: #ffe7e7;
  border: 2px solid #ff4d4d;
}

.result #label {
  font-size: 14px;
  color: #666;
}

.result #value {
  font-size: 48px;
  font-weight: 700;
  color: #222;
}

.hidden { display:none; }

#loading {
  margin-top: 10px;
  color:#0078ff;
  font-weight:600;
}
</style>
</head>

<body>

<div class="container">
  <h1>Digit Recognition</h1>

  <h3>Draw Digit (28×28)</h3>
  <canvas id="board" width="280" height="280"></canvas><br>
  <button onclick="clearCanvas()">Clear</button>
  <button onclick="predictDraw()">Predict</button>

  <hr>

  <h3>Or Upload CSV</h3>
  <form id="uploadForm">
    <input type="file" id="fileInput" name="file" accept=".csv"/>
    <button type="submit">Predict</button>
  </form>

  <div id="loading" class="hidden">⏳ Predicting…</div>

  <div id="resultBox" class="result hidden">
      <div id="label">Prediction</div>
      <div id="value">—</div>
  </div>
</div>


<script>
  let grid = Array.from({length: SIZE}, ()=> Array(SIZE).fill(0));

/* ---------------- Canvas Logic ---------------- */
const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");

const DISPLAY = 280;   // visible size
const SIZE = 28;       // logical MNIST size
const CELL = DISPLAY / SIZE;

ctx.fillStyle = "black";
ctx.fillRect(0,0,DISPLAY,DISPLAY);
  grid[y][x] = 255;

let drawing = false;

canvas.addEventListener("mousedown", ()=> drawing=true);
canvas.addEventListener("mouseup", ()=> drawing=false);
canvas.addEventListener("mouseleave", ()=> drawing=false);
canvas.addEventListener("mousemove", drawPixel);

function drawPixel(e){
  if(!drawing) return;

  const x = Math.floor(e.offsetX / CELL);
  const y = Math.floor(e.offsetY / CELL);

  ctx.fillStyle = "white";
  ctx.fillRect(x*CELL, y*CELL, CELL, CELL);
}

function clearCanvas(){
  ctx.fillStyle="black";
  ctx.fillRect(0,0,DISPLAY,DISPLAY);
}

/* ---------------- Result UI ---------------- */
function showPrediction(data) {
  const box = document.getElementById("resultBox");
  const value = document.getElementById("value");
  const label = document.getElementById("label");

  box.classList.remove("hidden");

  if (data && data.prediction !== undefined) {
    box.classList.remove("error");
    box.classList.add("success");
    label.textContent = "Predicted Digit";
    value.textContent = data.prediction;
  } else {
    box.classList.remove("success");
    box.classList.add("error");
    label.textContent = "Error";
    value.textContent = "!";
  }

  box.style.transform = "scale(0.9)";
  setTimeout(() => box.style.transform = "scale(1)", 120);
}

/* ---------------- Draw → Predict ---------------- */
async function predictDraw(){
  document.getElementById("loading").classList.remove("hidden");

  let pixels = [];
  for (let y=0; y<SIZE; y++)
  for (let x=0; x<SIZE; x++)
    pixels.push(grid[y][x]);

  const csvRow = pixels.join(",");

  try {
    const res = await fetch("/predict-draw",{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({csv:csvRow})
    });

    const data = await res.json();
    showPrediction(data);
  }
  catch(err){
    showPrediction({error:true});
  }

  document.getElementById("loading").classList.add("hidden");
}

/* ---------------- CSV Upload ---------------- */
const form = document.getElementById("uploadForm");
form.addEventListener("submit", async (e)=>{
  e.preventDefault();

  document.getElementById("loading").classList.remove("hidden");

  const file=document.getElementById("fileInput").files[0];
  if(!file) return;

  const fd=new FormData();
  fd.append("file",file);

  try {
    const res=await fetch("/predict",{method:"POST",body:fd});
    const j = await res.json();
    showPrediction(j);
  } catch(e){
    showPrediction({error:true});
  }

  document.getElementById("loading").classList.add("hidden");
});
</script>

</body>
</html>
