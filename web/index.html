<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Digit Recognition</title>

<style>
body {
  font-family: "Segoe UI", Roboto, Arial;
  background:#f5f7fa;
  display:flex;
  justify-content:center;
}
.container {
  background:white;
  width:450px;
  margin-top:50px;
  padding:25px 30px;
  border-radius:14px;
  box-shadow:0 8px 18px rgba(0,0,0,.08);
  text-align:center;
}
h1 { margin-top:0; }

canvas {
  background:black;
  border-radius:10px;
  cursor:crosshair;
}
button {
  background:#0078ff;
  border:none;
  color:white;
  padding:10px 18px;
  border-radius:8px;
  cursor:pointer;
  margin:10px;
}
button:hover { background:#005dcc; }

#result {
  margin-top:20px;
  padding:12px;
  background:#eef3ff;
  border-radius:8px;
}
</style>
</head>

<body>

<div class="container">
  <h1>Digit Recognition</h1>

  <h3>Draw Digit</h3>
  <canvas id="board" width="280" height="280"></canvas><br>
  <button onclick="clearCanvas()">Clear</button>
  <button onclick="predictDraw()">Predict</button>

  <hr>

  <h3>Or Upload CSV</h3>
  <form id="uploadForm">
    <input type="file" id="fileInput" name="file" accept=".csv"/>
    <button type="submit">Predict</button>
  </form>

  <pre id="result"></pre>
</div>


<script>
const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");

ctx.fillStyle="black";
ctx.fillRect(0,0,280,280);

let drawing=false;

canvas.addEventListener("mousedown",()=>drawing=true);
canvas.addEventListener("mouseup",()=>drawing=false);
canvas.addEventListener("mousemove",draw);

function draw(e){
  if(!drawing) return;
  ctx.fillStyle="white";
  ctx.beginPath();
  ctx.arc(e.offsetX, e.offsetY, 12, 0, Math.PI*2);
  ctx.fill();
}

function clearCanvas(){
  ctx.fillStyle="black";
  ctx.fillRect(0,0,280,280);
}

async function predictDraw(){
  // downscale 280x280 → 28x28 grayscale
  const small = document.createElement("canvas");
  small.width=28;
  small.height=28;
  const sctx = small.getContext("2d");
  sctx.drawImage(canvas,0,0,28,28);

  let pixels=[];
  const imgData = sctx.getImageData(0,0,28,28).data;

  for(let i=0;i<imgData.length;i+=4){
    const r = imgData[i];
    pixels.push(Math.round(r/255*255)); // normalize MNIST style
  }

  const csvRow = pixels.join(",");

  const res = await fetch("/predict-draw",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({csv:csvRow})
  });

  const data = await res.json();
  document.getElementById("result").textContent =
      JSON.stringify(data,null,2);
}

// Upload CSV existing feature (unchanged)
const form = document.getElementById("uploadForm");
form.addEventListener("submit", async (e)=>{
  e.preventDefault();
  const file=document.getElementById("fileInput").files[0];
  if(!file) return;
  const fd=new FormData();
  fd.append("file",file);
  const res=await fetch("/predict",{method:"POST",body:fd});
  document.getElementById("result")
    .textContent=JSON.stringify(await res.json(),null,2);
});
</script>
</body>
</html>
